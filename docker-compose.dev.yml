# Development overrides: bind-mount source → no image rebuild for code edits.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Rebuild image only when: Dockerfile / composer.lock / package-lock / system packages change.
# Recreate containers (no --build) when: .env or compose `environment:` values change.
# PHP/React source edits: hot path — FE via Vite HMR; BE via bind-mount (no restart).

services:
  backend:
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  scheduler:
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"

  frontend:
    image: node:22-alpine
    build: !reset
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:80}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports: !override
      - "${FRONTEND_PORT:-5173}:5173"
    command: sh -c "if [ ! -d node_modules/vite ]; then npm ci; fi && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  backend_vendor:
  frontend_node_modules:
