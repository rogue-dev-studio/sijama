services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sijama}
      POSTGRES_USER: ${POSTGRES_USER:-sijama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sijama}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sijama} -d ${POSTGRES_DB:-sijama}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BACKEND_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-SIJAMA}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-sijama}
      DB_USERNAME: ${POSTGRES_USER:-sijama}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sijama}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@sijama.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-SIJAMA}
      SMS_DRIVER: ${SMS_DRIVER:-log}
      PASSWORD_RESET_PHONE_ENABLED: ${PASSWORD_RESET_PHONE_ENABLED:-false}
      PASSWORD_RESET_EMAIL_ENABLED: ${PASSWORD_RESET_EMAIL_ENABLED:-true}
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      FONNTE_ENDPOINT: ${FONNTE_ENDPOINT:-https://api.fonnte.com/send}
      SMS_COUNTRY_CODE: ${SMS_COUNTRY_CODE:-62}
      TELEGRAM_BOT_ENABLED: ${TELEGRAM_BOT_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      N8N_ENABLED: ${N8N_ENABLED:-false}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,127.0.0.1:5173
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.5}
      CONTAINER_ROLE: web
    # Dev live-reload (BE+FE): docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
    restart: unless-stopped

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      APP_NAME: ${APP_NAME:-SIJAMA}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_DB:-sijama}
      DB_USERNAME: ${POSTGRES_USER:-sijama}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-sijama}
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      CONTAINER_ROLE: scheduler
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
