# SIJAMA — GitLab CI/CD (test → build → deploy)
# DB production: Aiven PostgreSQL (via server .env, not used in test stage)
# App hosting: VPS/server pull from GitLab Container Registry (manual deploy job)

stages:
  - test
  - build
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_DRIVER: overlay2
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend

.default_rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

test:backend:
  stage: test
  image: php:8.2-cli
  extends: .default_rules
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git unzip libzip-dev libpq-dev libpng-dev libjpeg62-turbo-dev libfreetype6-dev libonig-dev
    - docker-php-ext-configure gd --with-freetype --with-jpeg
    - docker-php-ext-install -j"$(nproc)" zip gd mbstring bcmath pdo_pgsql
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
  script:
    - cd backend
    - composer install --no-interaction --prefer-dist
    - cp .env.example .env
    - php artisan key:generate --force
    - php artisan test --without-tty
  cache:
    key: composer-$CI_COMMIT_REF_SLUG
    paths:
      - backend/vendor/

test:frontend:
  stage: test
  image: node:22-alpine
  extends: .default_rules
  variables:
    VITE_API_URL: ${PRODUCTION_API_URL:-http://localhost:8080}
  script:
    - cd frontend
    - npm ci
    - npm run build
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths:
      - frontend/node_modules/

build:images:
  stage: build
  image: docker:27-cli
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" -t "$BACKEND_IMAGE:latest" ./backend
    - |
      docker build \
        --build-arg "VITE_API_URL=${PRODUCTION_API_URL:-http://localhost:8080}" \
        -t "$FRONTEND_IMAGE:$IMAGE_TAG" \
        -t "$FRONTEND_IMAGE:latest" \
        ./frontend
    - docker push "$BACKEND_IMAGE:$IMAGE_TAG"
    - docker push "$BACKEND_IMAGE:latest"
    - docker push "$FRONTEND_IMAGE:$IMAGE_TAG"
    - docker push "$FRONTEND_IMAGE:latest"

deploy:production:
  stage: deploy
  image: alpine:3.21
  needs:
    - job: build:images
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
  script:
    - export IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - export DEPLOY_DIR="${DEPLOY_DIR:-/opt/sijama}"
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_DIR/scripts'"
    - scp docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/docker-compose.prod.yml"
    - scp scripts/ci-deploy-remote.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_DIR/scripts/ci-deploy-remote.sh"
    - |
      ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" \
        "DEPLOY_DIR='$DEPLOY_DIR' \
         SIJAMA_BACKEND_IMAGE='$BACKEND_IMAGE:$IMAGE_TAG' \
         SIJAMA_FRONTEND_IMAGE='$FRONTEND_IMAGE:$IMAGE_TAG' \
         REGISTRY_USER='$CI_REGISTRY_USER' \
         REGISTRY_PASSWORD='$CI_REGISTRY_PASSWORD' \
         REGISTRY='$CI_REGISTRY' \
         bash '$DEPLOY_DIR/scripts/ci-deploy-remote.sh'"
  environment:
    name: production
    url: $PRODUCTION_APP_URL
