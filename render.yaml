# Render Blueprint — SIJAMA (Laravel API + React static + Aiven PostgreSQL)
# Deploy: Dashboard → New → Blueprint → connect GitLab repo rogue-dev-studio/sijama
# Set secret env vars (APP_KEY, DB_*) saat pertama deploy.

services:
  - type: web
    name: sijama-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: SIJAMA
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: APP_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: sijama-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: FRONTEND_URL
        fromService:
          type: web
          name: sijama-web
          envVarKey: RENDER_EXTERNAL_URL
      # Set to "true" once in Render Dashboard → redeploy → unset (free tier has no Shell).
      - key: MIGRATE_FRESH_ON_DEPLOY
        sync: false
      - key: SEED_ON_DEPLOY
        sync: false
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        sync: false

  - type: web
    name: sijama-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Proxy media + API ke sijama-api (gambar same-origin, hindari cross-origin blocked)
      - type: rewrite
        source: /storage/*
        destination: https://sijama-api.onrender.com/storage/*
      - type: rewrite
        source: /api/*
        destination: https://sijama-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: sijama-api
          envVarKey: RENDER_EXTERNAL_URL
